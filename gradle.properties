# =====================================================================
# Project settings. This is the only file to edit for a new project.
#
# New project workflow:
#   1. Copy the template and edit the values below.
#   2. Run once: ./gradlew initProject
#      (renames the package, classes, folders and assets from
#       base_package, class_prefix, mod_id and mod_name)
#   3. Build: ./gradlew build
# =====================================================================

org.gradle.jvmargs=-Xmx1G

# ---- 1. Project identity (read on every build) ------------------------
maven_group=com.example
mod_version=0.1.0
mod_name=Template Mod
mod_archive_name=TemplateMod
mod_description=Description of your mod or plugin.
author=Your Name
author_website=https://example.com
source_url=https://github.com/your-name/your-project
issues_url=https://github.com/your-name/your-project/issues
license=MIT

# ---- 2. Code identity (applied ONCE by ./gradlew initProject) ----------
# mod_id       : Fabric mod id, asset namespace, Paper command name
# base_package : root Java package
# class_prefix : class name prefix (e.g. "Template" -> PaperTemplate, FabricTemplate, TemplateConfig)
mod_id=template
base_package=com.example.template
class_prefix=Template

# ---- 3. Modrinth ------------------------------------------------------
modrinth_id=your-project-slug
modrinth_version_type=release
# For multiple lines, end each one with \n\
modrinth_changelog=First release.
modrinth_fabric_loaders=fabric,quilt
modrinth_paper_loaders=paper,purpur,folia
modrinth_game_versions=26.1,26.1.1,26.1.2,26.2,26.3
modrinth_legacy_game_versions=1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11
modrinth_paper_extra_game_versions=1.21.1,1.21.2,1.21.3,1.21.4,1.21.5

# ---- 4. Fabric new (unobfuscated Minecraft, Java 25) ------------------
new_minecraft=26.3
new_mc_range=>=26.1
new_fabric_api=0.162.0+26.3
java_new=25

# ---- 5. Fabric legacy (obfuscated Minecraft 1.21.x, Java 21) ----------
legacy_minecraft=1.21.11
legacy_mc_range=>=1.21.6 <26
legacy_fabric_api=0.141.6+1.21.11
java_legacy=21

# ---- 6. Shared by the loaders -----------------------------------------
fabric_loader_version=0.20.1

# ---- 7. Paper / Purpur / Folia ----------------------------------------
# Compile API: the oldest supported version
paper_api=1.21.1-R0.1-SNAPSHOT
# Version used by ./gradlew runServer
paper_run_version=26.3
bstats_version=3.2.1
